# Casbin RBAC 模型配置
#
# 中文说明：
# - sub: 主体（用户/角色），obj: 资源（API 路径/对象），act: 操作（HTTP 方法/动作）；
# - g = _, _: 支持角色继承（角色可以拥有其他角色的权限）；
# - 匹配规则：主体通过角色继承匹配，资源和操作必须精确匹配；
# - 策略效果：只要有一条策略允许就放行（some(where (p.eft == allow))）。

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && r.obj == p.obj && r.act == p.act